services:
  postgres:
    image: postgres:17-alpine
    container_name: dealerdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./database/02_init_data.sql:/docker-entrypoint-initdb.d/02_init_data.sql
      - ./database/03_init_indexes.sql:/docker-entrypoint-initdb.d/03_init_indexes.sql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge